name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test / Lint / Fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (spine2d)
        run: cargo clippy -p spine2d --all-targets --features json,binary -- -D warnings

      - name: Clippy (spine2d-wgpu, wgpu 29)
        run: cargo clippy -p spine2d-wgpu --all-targets --features json -- -D warnings

      - name: Clippy (spine2d-wgpu, wgpu 30)
        run: cargo clippy -p spine2d-wgpu --no-default-features --features json,wgpu-30 --lib --example basic -- -D warnings

      - name: Clippy (spine2d-web, wgpu 29)
        run: cargo clippy -p spine2d-web --target wasm32-unknown-unknown -- -D warnings

      - name: Clippy (spine2d-web, wgpu 30)
        run: cargo clippy -p spine2d-web --target wasm32-unknown-unknown --no-default-features --features wgpu-30 -- -D warnings

      - name: Test (spine2d-web)
        run: cargo test -p spine2d-web

      - name: Test (no features)
        run: cargo test -p spine2d

      - name: Test (parsing/runtime features)
        run: cargo test -p spine2d --features json,binary

      - name: Check (spine2d-bevy)
        run: cargo check -p spine2d-bevy
