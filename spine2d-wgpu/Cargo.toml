[package]
name = "spine2d-wgpu"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/spine2d-wgpu"
description = "wgpu renderer integration for the spine2d runtime"
readme = "../README.md"
keywords = ["spine", "spine2d", "wgpu", "animation", "skeletal"]
categories = ["game-development", "rendering"]

[dependencies]
spine2d = { path = "../spine2d", version = "0.5.0", default-features = false }
wgpu-29 = { workspace = true, optional = true }
wgpu-30 = { workspace = true, optional = true }
bytemuck.workspace = true

[features]
default = ["wgpu-29"]
json = ["spine2d/json"]
wgpu-29 = ["dep:wgpu-29"]
wgpu-30 = ["dep:wgpu-30"]

[dev-dependencies]
winit = "0.30"
pollster = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
egui = "0.35"
egui-winit = "0.35"
egui-wgpu = { version = "0.35", features = ["winit"] }

[[example]]
name = "basic"
required-features = ["json"]

[[example]]
name = "spine_runtimes"
required-features = ["json", "wgpu-29"]

[package.metadata.docs.rs]
no-default-features = true
all-features = false
features = ["wgpu-29"]
rustdoc-args = ["--cfg", "docsrs"]
